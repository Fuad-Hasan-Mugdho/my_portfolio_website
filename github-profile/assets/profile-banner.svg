<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Fuad Hasan Chowdhury — Senior Software Engineer</title>
  <desc id="desc">Backend architecture, database performance, and banking systems</desc>
  <defs>
