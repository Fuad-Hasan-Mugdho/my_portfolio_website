    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#fff" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#warm)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1055" cy="64" r="150" fill="#5bc0de" opacity=".07"/>
  <circle cx="1135" cy="320" r="190" fill="#d44b26" opacity=".09"/>
